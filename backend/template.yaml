AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Local debugging template for AI Agent Lambda

Resources:
  LocalAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/                    # 指向你存放 lambda_function.py 的目录
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Timeout: 600                     # 本地调试给足超时时间
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: "MockTable"      # 本地环境变量
          BUCKET_NAME: "MockBucket"